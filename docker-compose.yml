services:
  db:
    image: postgres:18-alpine
    container_name: vmarket-db
    environment:
      POSTGRES_USER: vmarket
      POSTGRES_PASSWORD: vmarket
      POSTGRES_DB: vmarket
    ports:
      - "5433:5432"
    volumes:
      - vmarket-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmarket -d vmarket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vmarket-db-data:
